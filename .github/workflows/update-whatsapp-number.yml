name: Atualizar WhatsApp do site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Atualizar numero do WhatsApp do site [bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Substituir numero antigo
        run: |
          OLD='5588920033309'
          NEW='5511972938984'
          grep -RIl --exclude-dir=.git "$OLD" . | xargs -r sed -i "s/$OLD/$NEW/g"
      - name: Commit alteracoes
        run: |
          if git diff --quiet; then
            echo 'Nenhuma ocorrencia encontrada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Atualizar numero do WhatsApp do site [bot]'
          git push
