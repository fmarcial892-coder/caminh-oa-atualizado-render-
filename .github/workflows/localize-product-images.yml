name: Localizar fotos reais dos produtos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar e validar fotos reais, produto por produto
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import os,re,sys,subprocess
          from urllib.parse import urlparse,quote

          text=open('app.js',encoding='utf-8').read()
          rx=re.compile(r"\{id:'([^']+)'[^}]*?name:'([^']+)'[^}]*?code:'([^']+)'[^}]*?price:([^,]+),[^}]*?img:'([^']*)'")
          rows=list(rx.finditer(text))
          os.makedirs('assets/produtos',exist_ok=True)

          # Somente produtos que ainda estavam falhando. Os que já funcionam não são refeitos.
          pages={
            'r2':'https://www.mundodocaminhao.com.br/roda-de-aluminio-gt1-caminhao-aro-22-5-x-8-25-10-furos-alto-brilho',
            'r3':'https://www.engevelpecas.com.br/rodas/roda-de-aluminio-speedline-caminhao-aro-22-5-x-8-25-10-furos-italspeed',
            'r4':'https://www.mundodocaminhao.com.br/roda-de-aco-para-caminhao-aro-225-x-750-10-furos-pneu-275',
            'r5':'https://www.mundodocaminhao.com.br/roda-de-aco-para-caminhao-aro-225-x-825-10-furos-pneu-295',
            'r6':'https://www.mundodocaminhao.com.br/roda-de-aluminio-caminhao-alto-brilho-borda-larga-aro-225-x-825-ultra-better-old-trucker',
            'r7':'https://www.mundodocaminhao.com.br/roda-de-aluminio-caminhao-34-speedline-aro-175-x-6-6-furos-italspeed',
            'r8':'https://www.mundodocaminhao.com.br/roda-de-aco-para-caminhao-aro-175-x-600-6-furos-pneu-215-e-235',
            'r9':'https://www.mundodocaminhao.com.br/calota-protetora-roda-cromada-caminhao-aro-225-par-bepo',
            'r10':'https://www.mundodocaminhao.com.br/calota-speed-truck-caminhao-aro-225-10-furos-cromada-jetta',
            'm1':'https://www.autoz.com.br/camisa-motor-std-c9720std-metal-leve/p',
            'm2':'https://www.autoz.com.br/bronzina-mancal-motor-std-bc852jstd-metal-leve/p',
            'm5':'https://www.autoz.com.br/bronzina-mancal-0-25-bc1084p025-metal-leve/p',
            'm6':'https://www.autoz.com.br/bronzina-mancal-std-m21503std-metal-leve/p',
            'm7':'https://www.autoz.com.br/filtro-combustivel-kc118-mahle/p',
            'm8':'https://busca.autoz.com.br/filtro-ar-lx273-mahle/p',
            's1':'https://www.pitstop.com.br/amortecedor-de-suspensao-dianteiro-p--caminhao---cofap---l-13350-1031924/p',
            's6':'https://www.pitstop.com.br/amortecedor-traseiro-super-agrale-volare-a6a8ma-1998-a-2011-cofap-l13828-1586/p',
            's9':'https://www.karhub.com.br/p/amortecedor-suspensao-dianteiro-para-agrale-ma-7-5-ma-8-5-cofap-l-12871-9524947',
            'c7':'https://www.morelate.com.br/cubo-roda-dianteiro----------',
          }

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          def curl(url,out,referer=None):
              cmd=['curl','-L','--fail','--silent','--show-error','--connect-timeout','20','--max-time','60','-A',UA,'-o',out,url]
              if referer: cmd += ['-e',referer]
              p=subprocess.run(cmd)
              return p.returncode==0 and os.path.exists(out) and os.path.getsize(out)>5000

          def curl_image(url,out,referer=None):
              # Primeiro tenta a imagem original; se o CDN bloquear o runner (403/429), usa apenas um proxy de imagem.
              if curl(url,out,referer): return True,url
              proxy='https://images.weserv.nl/?url='+quote(url,safe='')
              if curl(proxy,out,referer): return True,proxy
              return False,None

          def page_image(page,pid):
              html=f'/tmp/{pid}.html'
              if not curl(page,html): return None
              s=open(html,encoding='utf-8',errors='ignore').read()
              # Aceita meta tags independentemente da ordem dos atributos.
              for tag in re.findall(r'<meta\b[^>]*>',s,re.I):
                  attrs=dict((k.lower(),v) for k,v in re.findall(r'''([:\w-]+)\s*=\s*["']([^"']*)["']''',tag,re.I))
                  key=(attrs.get('property') or attrs.get('name') or '').lower()
                  if key in ('og:image','twitter:image') and attrs.get('content'):
                      return attrs['content'].replace('&amp;','&').replace('\\/','/')
              return None

          def image_is_real(path):
              if not os.path.exists(path) or os.path.getsize(path)<=5000: return False
              p=subprocess.run(['file','-b','--mime-type',path],capture_output=True,text=True)
              return p.returncode==0 and p.stdout.strip().startswith('image/')

          failures=[]; replacements={}
          for m in rows:
              pid,name,code,price,old=m.groups(); out=f'assets/produtos/{pid}.jpg'
              ok=False; used=None
              if old.startswith('http'):
                  ref=f'{urlparse(old).scheme}://{urlparse(old).netloc}/'
                  ok,used=curl_image(old,out,ref)
              if (not ok) and pid in pages:
                  img=page_image(pages[pid],pid)
                  if img:
                      if img.startswith('//'): img='https:'+img
                      if img.startswith('/'):
                          base=f'{urlparse(pages[pid]).scheme}://{urlparse(pages[pid]).netloc}'
                          img=base+img
                      ok,used=curl_image(img,out,pages[pid])
              if ok and not image_is_real(out):
                  ok=False
              if not ok:
                  failures.append((pid,code,name,old,pages.get(pid)))
                  try: os.remove(out)
                  except FileNotFoundError: pass
              else:
                  replacements[old]='/'+out
                  print(f'OK {pid} | {code} | {name} | {os.path.getsize(out)} bytes | {used}')

          if failures:
              print('\nFALHAS:')
              for f in failures: print(' -',f)
              sys.exit(1)

          for src,dst in replacements.items():
              text=text.replace("img:'"+src+"'", "img:'"+dst+"'")
          open('app.js','w',encoding='utf-8').write(text)
          print(f'Localizadas {len(rows)} fotos em assets/produtos/.')
          PY

      - name: Validação final — 50 produtos, 50 fotos locais e 50 preços
        run: |
          test "$(grep -o "id:'[a-z][0-9]*'" app.js | wc -l)" -eq 50
          test "$(grep -o "price:[0-9][0-9.]*" app.js | wc -l)" -eq 50
          if grep -nE "img:'https?://|img=\"https?://" app.js; then exit 1; fi
          count=$(find assets/produtos -type f | wc -l)
          echo "Fotos locais: $count"
          test "$count" -eq 50
          for id in r{1..10} p{1..10} m{1..10} s{1..10} c{1..10}; do test -f "assets/produtos/$id.jpg"; done
          for f in assets/produtos/*.jpg; do file -b --mime-type "$f" | grep -q '^image/'; done

      - name: Commit das fotos reais locais
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/produtos app.js
          git diff --cached --quiet || git commit -m 'Adicionar fotos reais verificadas dos 50 produtos'
          git push
